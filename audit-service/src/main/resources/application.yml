spring:
  application:
    name: audit-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5438}/${DB_NAME:banking_audit}
    username: ${DB_USER:banking_user}
    password: ${DB_PASSWORD:banking_pass}
    driver-class-name: org.postgresql.Driver

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: audit-service
      # earliest: on first startup read from the beginning of the topic.
      # Allows audit-service to rebuild its entire table by resetting offsets.
      auto-offset-reset: earliest
      # Commit offsets after each record is processed (see KafkaConsumerConfig).
      enable-auto-commit: false

  lifecycle:
    timeout-per-shutdown-phase: 25s

server:
  port: 8086
  shutdown: graceful

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0

spring.zipkin:
  base-url: http://${ZIPKIN_HOST:localhost}:9411

logging:
  level:
    com.banking: INFO
    org.hibernate.SQL: WARN
