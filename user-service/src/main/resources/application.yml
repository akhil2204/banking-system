spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:banking_users}
    username: ${DB_USER:banking_user}
    password: ${DB_PASSWORD:banking_pass}
    driver-class-name: org.postgresql.Driver

  data:
    web:
      pageable:
        # Serialize Page<T> using stable field names rather than Spring internals.
        # Without this, the JSON shape can differ between Spring Boot versions.
        default-page-size: 20
        max-page-size: 100

  flyway:
    # Flyway runs before Hibernate's SessionFactory is initialized.
    # It applies any pending V*__*.sql scripts in db/migration, then records
    # them in the flyway_schema_history table so they never run twice.
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      # 'validate' — Hibernate checks that every mapped column exists and has
      # a compatible type. If the schema drifts from the entities, the app
      # refuses to start. Flyway owns schema creation; Hibernate just verifies.
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    # open-in-view: false is important. The default (true) keeps the JPA
    # EntityManager open for the entire HTTP request lifecycle so lazy
    # collections can be fetched in the view layer. This is the N+1 query
    # problem waiting to happen. Disabling it forces you to load everything
    # you need in the service layer where @Transactional is in effect.
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8081

springdoc:
  api-docs:
    path: /api-docs          # raw OpenAPI JSON at /api-docs
  swagger-ui:
    path: /swagger-ui.html   # UI at /swagger-ui.html
    operations-sorter: method  # groups GET / POST / PUT / DELETE visually

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.banking: INFO
    org.hibernate.SQL: WARN
