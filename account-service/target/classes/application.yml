spring:
  application:
    name: account-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:banking_accounts}
    username: ${DB_USER:banking_user}
    password: ${DB_PASSWORD:banking_pass}
    driver-class-name: org.postgresql.Driver

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  flyway:
    enabled: true
    locations: classpath:db/migration

  cloud:
    openfeign:
      circuitbreaker:
        # Wraps every Feign call in a Resilience4j circuit breaker.
        enabled: true
        group:
          # group.enabled=true means all methods on the same FeignClient share
          # one circuit breaker named after the client (e.g. "user-service").
          # group.enabled=false (default) creates one CB per method signature,
          # which gives finer granularity but more config overhead.
          enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  lifecycle:
    timeout-per-shutdown-phase: 25s

server:
  port: 8082
  shutdown: graceful

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

resilience4j:
  circuitbreaker:
    instances:
      user-service:
        # sliding-window-size: evaluate the last 10 calls to decide state.
        sliding-window-size: 10
        # Open the circuit when ≥50% of the last 10 calls fail.
        failure-rate-threshold: 50
        # Stay OPEN for 10s, then transition to HALF-OPEN to test recovery.
        wait-duration-in-open-state: 10s
        # In HALF-OPEN: allow 3 test calls. If they succeed, close the circuit.
        permitted-number-of-calls-in-half-open-state: 3
        # Don't evaluate until at least 5 calls have been recorded.
        # Prevents flapping on startup when only 1-2 calls have been made.
        minimum-number-of-calls: 5
        # Expose circuit breaker state via /actuator/health
        register-health-indicator: true
        # 4xx responses mean the request was valid but the resource was wrong
        # (e.g. user not found). These are NOT signs that user-service is down —
        # don't count them toward the failure rate.
        ignore-exceptions:
          - feign.FeignException.NotFound
          - feign.FeignException.BadRequest

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

logging:
  level:
    com.banking: INFO
    org.hibernate.SQL: WARN
